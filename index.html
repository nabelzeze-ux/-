<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎡 عجلة الحظ - X TEAM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #1a1a3e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            direction: rtl;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }
        
        .title {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2), 0 0 80px rgba(255, 215, 0, 0.1);
            touch-action: none;
            background: #1a1a3e;
        }
        
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
            z-index: 10;
        }
        
        .spin-btn {
            margin-top: 25px;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a3e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            width: 100%;
            max-width: 300px;
        }
        
        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.5);
        }
        
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .spin-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        .result {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            min-height: 50px;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .spins-info {
            color: #aaa;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .spins-info span {
            color: #FFD700;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .pulse {
            animation: pulse 1s ease-in-out infinite;
        }
        
        .loading {
            color: #aaa;
            font-size: 16px;
            margin-top: 20px;
        }
        
        .winner-text {
            font-size: 28px;
            color: #FFD700;
            animation: winAnimation 0.5s ease-in-out;
        }
        
        @keyframes winAnimation {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* تنسيق الجوائز داخل العجلة */
        .prize-text {
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 480px) {
            .title { font-size: 20px; }
            .spin-btn { font-size: 18px; padding: 14px 30px; }
            .result { font-size: 18px; }
            .pointer { font-size: 30px; top: -15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🎡 عجلة الحظ</div>
        <div class="subtitle">X TEAM - جرب حظك اليوم!</div>
        
        <div class="wheel-wrapper">
            <div class="pointer">▼</div>
            <canvas id="wheel" width="600" height="600"></canvas>
        </div>
        
        <div class="spins-info">🎫 اللفات المتاحة: <span id="spinsCount">0</span></div>
        
        <button class="spin-btn pulse" id="spinBtn" disabled>🚫 لا توجد لفات</button>
        <div class="result" id="result"></div>
        
        <div class="loading" id="loading">⏳ جاري التحميل...</div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
